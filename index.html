<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>自動レイアウト フローチャート作成ツール</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: none; /* Prevent scroll on mobile during pan */
    }
    .bg-grid {
      background-size: 20px 20px;
      background-image: radial-gradient(circle, rgba(0,0,0,0.12) 1px, transparent 1px);
    }
    .node-transition {
      transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1), top 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.2);
      border-radius: 3px;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 h-screen w-screen overflow-hidden flex flex-col select-none">

  <!-- Header / Toolbar -->
  <header class="bg-white border-b border-slate-200 px-3 md:px-6 py-2.5 flex flex-wrap items-center justify-between z-20 shadow-sm flex-shrink-0 gap-2">
    <div class="flex items-center space-x-2">
      <div class="bg-indigo-600 text-white p-1.5 md:p-2 rounded-lg shadow">
        <i data-lucide="git-fork" class="w-4 h-4 md:w-5 md:h-5"></i>
      </div>
      <div>
        <h1 class="font-bold text-sm md:text-base text-slate-800 leading-none">フローチャート</h1>
        <span id="saveStatus" class="text-[10px] text-emerald-600 font-medium flex items-center gap-0.5 mt-0.5">
          <i data-lucide="check" class="w-3 h-3"></i> 保存済み
        </span>
      </div>
    </div>

    <!-- Actions Right -->
    <div class="flex items-center flex-wrap gap-1.5 md:gap-2">
      <!-- Canvas Canvas Background Picker -->
      <div class="flex items-center bg-slate-100 rounded-lg px-2 py-1 border border-slate-200 gap-1.5" title="キャンバス背景色">
        <span class="text-[11px] font-medium text-slate-500 hidden sm:inline">背景:</span>
        <input type="color" id="canvasBgPicker" value="#f1f5f9" class="w-5 h-5 rounded cursor-pointer border-0 p-0 bg-transparent">
      </div>

      <!-- Zoom Controls -->
      <div class="flex items-center bg-slate-100 rounded-lg p-0.5 border border-slate-200">
        <button id="btnZoomOut" title="縮小" class="p-1.5 hover:bg-white rounded text-slate-600 active:bg-slate-200">
          <i data-lucide="zoom-out" class="w-3.5 h-3.5"></i>
        </button>
        <span id="zoomLevel" class="text-[11px] font-semibold px-1.5 text-slate-600 min-w-[36px] text-center">100%</span>
        <button id="btnZoomIn" title="拡大" class="p-1.5 hover:bg-white rounded text-slate-600 active:bg-slate-200">
          <i data-lucide="zoom-in" class="w-3.5 h-3.5"></i>
        </button>
        <button id="btnResetZoom" title="位置リセット" class="p-1.5 hover:bg-white rounded text-slate-600 ml-0.5 border-l border-slate-200">
          <i data-lucide="maximize-2" class="w-3.5 h-3.5"></i>
        </button>
      </div>

      <!-- Data Actions -->
      <button id="btnResetData" class="p-1.5 md:px-2.5 md:py-1.5 text-xs font-medium text-red-600 hover:bg-red-50 rounded-lg border border-red-200 flex items-center gap-1">
        <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
        <span class="hidden md:inline">リセット</span>
      </button>

      <button id="btnDownloadPng" class="px-2.5 py-1.5 text-xs font-semibold text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg shadow-sm flex items-center gap-1">
        <i data-lucide="download" class="w-3.5 h-3.5"></i>
        <span>PNG</span>
      </button>
    </div>
  </header>

  <!-- Main Work Area -->
  <main class="flex-1 relative overflow-hidden bg-slate-100 bg-grid cursor-grab active:cursor-grabbing" id="viewport">
    <!-- Transform Wrapper for Pan & Zoom -->
    <div id="scene" class="absolute left-0 top-0 origin-0 transition-transform duration-75">
      <!-- SVG Connectors Layer -->
      <svg id="svgLayer" class="absolute left-0 top-0 pointer-events-none" style="overflow: visible;">
        <defs>
          <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
          </marker>
        </defs>
      </svg>

      <!-- HTML Nodes Container Layer -->
      <div id="nodesContainer" class="absolute left-0 top-0"></div>
    </div>
  </main>

  <!-- Node Style/Image Settings Drawer/Modal -->
  <div id="nodeSettingsModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white rounded-t-2xl sm:rounded-2xl shadow-xl border border-slate-100 w-full max-w-md overflow-hidden transform transition-all translate-y-full sm:translate-y-0 sm:scale-95 opacity-0" id="nodeSettingsCard">
      <div class="px-5 py-3.5 border-b border-slate-100 flex justify-between items-center bg-slate-50">
        <h3 class="font-bold text-slate-800 text-sm flex items-center gap-2">
          <i data-lucide="palette" class="w-4 h-4 text-indigo-600"></i>
          ノードのスタイル・設定
        </h3>
        <button id="btnSettingsClose" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <div class="p-5 space-y-4">
        <!-- Color Customization -->
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">背景色 (HEX)</label>
            <div class="flex items-center gap-2 border border-slate-200 rounded-lg p-1.5 bg-slate-50">
              <input type="color" id="nodeBgColorPicker" class="w-6 h-6 rounded cursor-pointer border-0 p-0 bg-transparent">
              <input type="text" id="nodeBgColorText" class="w-full text-xs font-mono bg-transparent outline-none uppercase" placeholder="#FFFFFF">
            </div>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">文字色 (HEX)</label>
            <div class="flex items-center gap-2 border border-slate-200 rounded-lg p-1.5 bg-slate-50">
              <input type="color" id="nodeTextColorPicker" class="w-6 h-6 rounded cursor-pointer border-0 p-0 bg-transparent">
              <input type="text" id="nodeTextColorText" class="w-full text-xs font-mono bg-transparent outline-none uppercase" placeholder="#000000">
            </div>
          </div>
        </div>

        <!-- Image Input -->
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">ノード内画像</label>
          <div class="space-y-2">
            <div class="flex gap-2">
              <input type="text" id="nodeImageUrl" placeholder="画像のURLを入力..." class="flex-1 text-xs p-2.5 rounded-lg border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none">
              <label class="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-medium cursor-pointer border border-slate-200 flex items-center justify-center shrink-0">
                <i data-lucide="upload" class="w-3.5 h-3.5 mr-1"></i> ファイル
                <input type="file" id="nodeFileInput" accept="image/*" class="hidden">
              </label>
            </div>
            <!-- Image Preview -->
            <div id="nodeImagePreviewBox" class="relative hidden rounded-lg overflow-hidden border border-slate-200 max-h-28 bg-slate-50 flex justify-center items-center p-2">
              <img id="nodeImagePreview" src="" alt="Preview" class="max-h-24 object-contain rounded">
              <button id="btnRemoveNodeImage" class="absolute top-2 right-2 bg-slate-900/70 hover:bg-slate-900 text-white p-1 rounded-full text-xs transition">
                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
              </button>
            </div>
          </div>
        </div>
      </div>

      <div class="px-5 py-3 bg-slate-50 border-t border-slate-100 flex justify-end gap-2">
        <button id="btnSettingsSave" class="w-full sm:w-auto px-4 py-2 text-xs font-semibold text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg transition shadow-sm">完了</button>
      </div>
    </div>
  </div>

  <!-- Notification Toast -->
  <div id="toast" class="fixed bottom-4 right-4 bg-slate-800 text-white text-xs px-3.5 py-2.5 rounded-xl shadow-lg border border-slate-700 flex items-center space-x-2 translate-y-20 opacity-0 transition-all z-50 pointer-events-none">
    <i data-lucide="info" class="w-4 h-4 text-indigo-400"></i>
    <span id="toastMsg">メッセージ</span>
  </div>

  <script>
    // --- INITIAL TREE DATA ---
    const defaultData = {
      id: 'node-root',
      text: 'スタート (開始)',
      bgColor: '#4f46e5',
      textColor: '#ffffff',
      image: '',
      children: [
        {
          id: 'node-1',
          text: '条件分岐: ログイン確認',
          bgColor: '#d97706',
          textColor: '#ffffff',
          image: '',
          children: [
            {
              id: 'node-1-1',
              text: 'はい: マイページ表示',
              bgColor: '#059669',
              textColor: '#ffffff',
              image: '',
              children: []
            },
            {
              id: 'node-1-2',
              text: 'いいえ: ログイン画面へ',
              bgColor: '#e11d48',
              textColor: '#ffffff',
              image: '',
              children: []
            }
          ]
        }
      ]
    };

    // --- APPLICATION STATE ---
    let treeData = null;
    let canvasBgColor = '#f1f5f9';
    let editingNodeId = null;
    let zoomLevel = 1.0;
    let panX = 0;
    let panY = 0;
    
    // Pointer Drag / Touch State
    let isDragging = false;
    let startX = 0, startY = 0;
    let initialPinchDistance = null;

    // LAYOUT CONSTANTS (Optimized tight gap)
    const NODE_WIDTH = 200;
    const GAP_X = 24; // Horizontal gap between sibling trees
    const GAP_Y = 48; // Vertical gap between parent and child

    const STORAGE_KEY = 'flowchart_v2_data';

    // --- STORAGE MANAGEMENT ---
    function saveToStorage() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          tree: treeData,
          canvasBg: canvasBgColor
        }));
      } catch (e) {
        console.error('Storage error:', e);
      }
    }

    function loadFromStorage() {
      try {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) {
          const parsed = JSON.parse(stored);
          treeData = parsed.tree || parsed;
          canvasBgColor = parsed.canvasBg || '#f1f5f9';
          return true;
        }
      } catch (e) {
        console.error('Load error:', e);
      }
      return false;
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toastMsg').textContent = msg;
      toast.classList.remove('translate-y-20', 'opacity-0');
      setTimeout(() => toast.classList.add('translate-y-20', 'opacity-0'), 2500);
    }

    // --- LAYOUT ALGORITHM (Tight & Responsive Auto Layout) ---
    function measureSubtrees(node) {
      const nodeEl = document.getElementById(node.id);
      node._height = nodeEl ? nodeEl.offsetHeight : 80;

      if (!node.children || node.children.length === 0) {
        node._subtreeWidth = NODE_WIDTH;
        return;
      }

      let totalWidth = 0;
      node.children.forEach((child, idx) => {
        measureSubtrees(child);
        totalWidth += child._subtreeWidth;
        if (idx < node.children.length - 1) totalWidth += GAP_X;
      });

      node._subtreeWidth = Math.max(NODE_WIDTH, totalWidth);
    }

    function positionNodes(node, currentX, currentY) {
      node._x = currentX;
      node._y = currentY;

      if (!node.children || node.children.length === 0) return;

      let startX = currentX - node._subtreeWidth / 2;
      const nextY = currentY + node._height + GAP_Y;

      node.children.forEach((child) => {
        const childCenterX = startX + child._subtreeWidth / 2;
        positionNodes(child, childCenterX, nextY);
        startX += child._subtreeWidth + GAP_X;
      });
    }

    // --- RENDER ENGINE ---
    function render() {
      const container = document.getElementById('nodesContainer');
      const svgLayer = document.getElementById('svgLayer');

      // Update Canvas Background Color
      document.getElementById('viewport').style.backgroundColor = canvasBgColor;
      document.getElementById('canvasBgPicker').value = canvasBgColor;

      // STEP 1: Sync or Create Nodes in DOM (Required to calculate dynamic heights)
      const existingNodes = new Map();
      container.querySelectorAll('.flow-node').forEach(el => existingNodes.set(el.id, el));

      const allNodes = [];
      const connections = [];

      function collect(node, parent) {
        allNodes.push(node);
        if (parent) connections.push({ parent, child: node });
        if (node.children) node.children.forEach(c => collect(c, node));
      }
      collect(treeData, null);

      // Create / Update Node Elements
      allNodes.forEach(node => {
        let el = existingNodes.get(node.id);
        if (!el) {
          el = document.createElement('div');
          el.id = node.id;
          el.className = 'flow-node absolute node-transition rounded-xl shadow-md border border-black/10 flex flex-col justify-between overflow-hidden group';
          el.style.width = `${NODE_WIDTH}px`;
          container.appendChild(el);
        }

        // Apply Styles
        el.style.backgroundColor = node.bgColor || '#ffffff';
        el.style.color = node.textColor || '#1e293b';

        // Internal HTML Structure (Inline editable text without "edit" button needed)
        const imageHtml = node.image ? `
          <div class="w-full bg-black/5 flex items-center justify-center p-1.5 border-b border-black/10">
            <img src="${node.image}" class="max-w-full max-h-28 object-contain rounded" onerror="this.parentElement.style.display='none'">
          </div>
        ` : '';

        el.innerHTML = `
          ${imageHtml}
          <div class="p-2.5">
            <div 
              contenteditable="true" 
              class="node-text text-xs font-medium leading-relaxed outline-none focus:ring-1 focus:ring-indigo-400 rounded px-1 min-h-[1.5em] whitespace-pre-wrap break-words"
              data-node-id="${node.id}"
            >${escapeHtml(node.text)}</div>
          </div>
          <!-- Node Quick Controls -->
          <div class="px-2 py-1 bg-black/10 flex justify-between items-center opacity-80 group-hover:opacity-100 transition-opacity text-[11px] border-t border-black/5">
            <button onclick="openSettingsModal('${node.id}')" class="p-1 hover:bg-black/10 rounded flex items-center gap-0.5" title="色・画像の設定">
              <i data-lucide="palette" class="w-3 h-3"></i>
            </button>
            <div class="flex items-center gap-1">
              ${node.id !== treeData.id ? `
                <button onclick="handleDeleteNode('${node.id}')" class="p-1 hover:bg-red-500/20 text-red-500 rounded" title="削除">
                  <i data-lucide="trash-2" class="w-3 h-3"></i>
                </button>
              ` : ''}
              <button onclick="handleAddNode('${node.id}')" class="px-1.5 py-0.5 bg-white/30 hover:bg-white/50 rounded font-semibold flex items-center gap-0.5" title="分岐を追加">
                <i data-lucide="plus" class="w-3 h-3"></i> 追加
              </button>
            </div>
          </div>
        `;

        // Attach Inline Edit Listener
        const textEl = el.querySelector('.node-text');
        textEl.onblur = (e) => {
          const val = e.target.innerText.trim();
          if (node.text !== val) {
            node.text = val;
            render();
          }
        };

        // Prevent Panning while typing text
        textEl.onmousedown = (e) => e.stopPropagation();
        textEl.ontouchstart = (e) => e.stopPropagation();
      });

      // Remove obsolete nodes
      const activeIds = new Set(allNodes.map(n => n.id));
      existingNodes.forEach((el, id) => {
        if (!activeIds.has(id)) el.remove();
      });

      // STEP 2: Calculate Positions & Update Elements
      requestAnimationFrame(() => {
        measureSubtrees(treeData);
        positionNodes(treeData, 0, 40);

        allNodes.forEach(node => {
          const el = document.getElementById(node.id);
          if (el) {
            el.style.left = `${node._x - NODE_WIDTH / 2}px`;
            el.style.top = `${node._y}px`;
          }
        });

        // STEP 3: Draw Manhattan (Right-Angle) Orthogonal Connections
        const defs = svgLayer.querySelector('defs').outerHTML;
        svgLayer.innerHTML = defs;

        connections.forEach(({ parent, child }) => {
          const pEl = document.getElementById(parent.id);
          if (!pEl) return;

          const parentH = pEl.offsetHeight;

          const x1 = parent._x;
          const y1 = parent._y + parentH;
          const x2 = child._x;
          const y2 = child._y;

          const midY = y1 + (y2 - y1) / 2;

          // Manhattan orthogonal path (カギ線)
          const pathD = `M ${x1} ${y1} L ${x1} ${midY} L ${x2} ${midY} L ${x2} ${y2}`;

          const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          path.setAttribute('d', pathD);
          path.setAttribute('stroke', '#64748b');
          path.setAttribute('stroke-width', '2');
          path.setAttribute('fill', 'none');
          path.setAttribute('marker-end', 'url(#arrowhead)');
          svgLayer.appendChild(path);
        });

        lucide.createIcons();
        saveToStorage();
      });
    }

    // Helper functions
    function escapeHtml(str) {
      return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function findNode(node, id) {
      if (node.id === id) return node;
      if (node.children) {
        for (let child of node.children) {
          const res = findNode(child, id);
          if (res) return res;
        }
      }
      return null;
    }

    function deleteNode(parent, id) {
      if (!parent.children) return false;
      const idx = parent.children.findIndex(c => c.id === id);
      if (idx !== -1) {
        parent.children.splice(idx, 1);
        return true;
      }
      for (let child of parent.children) {
        if (deleteNode(child, id)) return true;
      }
      return false;
    }

    function generateId() {
      return 'node-' + Math.random().toString(36).substr(2, 9);
    }

    // Node Operations
    window.handleAddNode = function(parentId) {
      const parent = findNode(treeData, parentId);
      if (parent) {
        if (!parent.children) parent.children = [];
        parent.children.push({
          id: generateId(),
          text: '新規ステップ',
          bgColor: parent.bgColor,
          textColor: parent.textColor,
          image: '',
          children: []
        });
        render();
        showToast('分岐を追加しました');
      }
    };

    window.handleDeleteNode = function(nodeId) {
      if (nodeId === treeData.id) return;
      if (confirm('このノードと下位のすべての分岐を削除しますか？')) {
        deleteNode(treeData, nodeId);
        render();
        showToast('ノードを削除しました');
      }
    };

    // --- NODE SETTINGS MODAL (Colors & Image) ---
    window.openSettingsModal = function(nodeId) {
      editingNodeId = nodeId;
      const node = findNode(treeData, nodeId);
      if (!node) return;

      const bgColor = node.bgColor || '#ffffff';
      const textColor = node.textColor || '#1e293b';

      document.getElementById('nodeBgColorPicker').value = bgColor;
      document.getElementById('nodeBgColorText').value = bgColor;
      document.getElementById('nodeTextColorPicker').value = textColor;
      document.getElementById('nodeTextColorText').value = textColor;

      document.getElementById('nodeImageUrl').value = node.image || '';

      const previewBox = document.getElementById('nodeImagePreviewBox');
      const previewImg = document.getElementById('nodeImagePreview');
      if (node.image) {
        previewImg.src = node.image;
        previewBox.classList.remove('hidden');
      } else {
        previewBox.classList.add('hidden');
      }

      const modal = document.getElementById('nodeSettingsModal');
      const card = document.getElementById('nodeSettingsCard');
      modal.classList.remove('hidden');
      setTimeout(() => {
        card.classList.remove('translate-y-full', 'scale-95', 'opacity-0');
        card.classList.add('translate-y-0', 'scale-100', 'opacity-100');
      }, 10);
    };

    function closeSettingsModal() {
      const modal = document.getElementById('nodeSettingsModal');
      const card = document.getElementById('nodeSettingsCard');
      card.classList.remove('translate-y-0', 'scale-100', 'opacity-100');
      card.classList.add('translate-y-full', 'scale-95', 'opacity-0');
      setTimeout(() => {
        modal.classList.add('hidden');
        editingNodeId = null;
      }, 200);
    }

    // Color Pickers & Text Synchronization
    document.getElementById('nodeBgColorPicker').oninput = (e) => {
      document.getElementById('nodeBgColorText').value = e.target.value.toUpperCase();
    };
    document.getElementById('nodeBgColorText').oninput = (e) => {
      if (/^#[0-9A-F]{6}$/i.test(e.target.value)) {
        document.getElementById('nodeBgColorPicker').value = e.target.value;
      }
    };

    document.getElementById('nodeTextColorPicker').oninput = (e) => {
      document.getElementById('nodeTextColorText').value = e.target.value.toUpperCase();
    };
    document.getElementById('nodeTextColorText').oninput = (e) => {
      if (/^#[0-9A-F]{6}$/i.test(e.target.value)) {
        document.getElementById('nodeTextColorPicker').value = e.target.value;
      }
    };

    document.getElementById('canvasBgPicker').oninput = (e) => {
      canvasBgColor = e.target.value;
      render();
    };

    // Modal Image Preview Controls
    document.getElementById('nodeImageUrl').oninput = (e) => {
      const url = e.target.value;
      const previewBox = document.getElementById('nodeImagePreviewBox');
      if (url) {
        document.getElementById('nodeImagePreview').src = url;
        previewBox.classList.remove('hidden');
      } else {
        previewBox.classList.add('hidden');
      }
    };

    document.getElementById('nodeFileInput').onchange = (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (evt) => {
          const url = evt.target.result;
          document.getElementById('nodeImageUrl').value = url;
          document.getElementById('nodeImagePreview').src = url;
          document.getElementById('nodeImagePreviewBox').classList.remove('hidden');
        };
        reader.readAsDataURL(file);
      }
    };

    document.getElementById('btnRemoveNodeImage').onclick = () => {
      document.getElementById('nodeImageUrl').value = '';
      document.getElementById('nodeImagePreviewBox').classList.add('hidden');
    };

    document.getElementById('btnSettingsSave').onclick = () => {
      if (!editingNodeId) return;
      const node = findNode(treeData, editingNodeId);
      if (node) {
        node.bgColor = document.getElementById('nodeBgColorPicker').value;
        node.textColor = document.getElementById('nodeTextColorPicker').value;
        node.image = document.getElementById('nodeImageUrl').value;
        render();
        showToast('スタイルを変更しました');
      }
      closeSettingsModal();
    };

    document.getElementById('btnSettingsClose').onclick = closeSettingsModal;

    // --- TOUCH & MOUSE PAN & ZOOM ENGINE ---
    const viewport = document.getElementById('viewport');
    const scene = document.getElementById('scene');

    function updateTransform() {
      scene.style.transform = `translate(${panX}px, ${panY}px) scale(${zoomLevel})`;
      document.getElementById('zoomLevel').textContent = `${Math.round(zoomLevel * 100)}%`;
    }

    function centerView() {
      const rect = viewport.getBoundingClientRect();
      panX = rect.width / 2;
      panY = 50;
      zoomLevel = 1.0;
      updateTransform();
    }

    // Pointer events for unified Touch & Mouse pan
    viewport.onpointerdown = (e) => {
      if (e.target.closest('.flow-node') || e.target.closest('#header')) return;
      isDragging = true;
      startX = e.clientX - panX;
      startY = e.clientY - panY;
    };

    window.onpointermove = (e) => {
      if (!isDragging) return;
      panX = e.clientX - startX;
      panY = e.clientY - startY;
      updateTransform();
    };

    window.onpointerup = () => { isDragging = false; };

    // Mobile Pinch-Zoom Support
    viewport.addEventListener('touchmove', (e) => {
      if (e.touches.length === 2) {
        const dist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        if (initialPinchDistance === null) {
          initialPinchDistance = dist;
        } else {
          const factor = dist / initialPinchDistance;
          zoomLevel = Math.min(Math.max(0.3, zoomLevel * (factor > 1 ? 1.02 : 0.98)), 2.5);
          updateTransform();
        }
      }
    }, { passive: true });

    viewport.addEventListener('touchend', () => { initialPinchDistance = null; });

    // Wheel Zoom
    viewport.onwheel = (e) => {
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
      const newZoom = Math.min(Math.max(0.3, zoomLevel * zoomFactor), 2.5);

      const rect = viewport.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;

      panX = mouseX - (mouseX - panX) * (newZoom / zoomLevel);
      panY = mouseY - (mouseY - panY) * (newZoom / zoomLevel);

      zoomLevel = newZoom;
      updateTransform();
    };

    // Control Buttons
    document.getElementById('btnZoomIn').onclick = () => { zoomLevel = Math.min(2.5, zoomLevel * 1.15); updateTransform(); };
    document.getElementById('btnZoomOut').onclick = () => { zoomLevel = Math.max(0.3, zoomLevel / 1.15); updateTransform(); };
    document.getElementById('btnResetZoom').onclick = centerView;

    document.getElementById('btnResetData').onclick = () => {
      if (confirm('すべてのデータが初期化されます。よろしいですか？')) {
        treeData = JSON.parse(JSON.stringify(defaultData));
        canvasBgColor = '#f1f5f9';
        render();
        centerView();
        showToast('リセットしました');
      }
    };

    // --- PNG DOWNLOAD ---
    document.getElementById('btnDownloadPng').onclick = () => {
      showToast('画像を生成中...');
      const nodeElements = document.querySelectorAll('#nodesContainer > .flow-node');
      if (nodeElements.length === 0) return;

      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      nodeElements.forEach(el => {
        const x = parseFloat(el.style.left);
        const y = parseFloat(el.style.top);
        minX = Math.min(minX, x);
        minY = Math.min(minY, y);
        maxX = Math.max(maxX, x + el.offsetWidth);
        maxY = Math.max(maxY, y + el.offsetHeight);
      });

      const pad = 40;
      minX -= pad; minY -= pad; maxX += pad; maxY += pad;
      const w = maxX - minX;
      const h = maxY - minY;

      let nodesHtml = '';
      nodeElements.forEach(el => {
        const left = parseFloat(el.style.left) - minX;
        const top = parseFloat(el.style.top) - minY;
        const clone = el.cloneNode(true);
        const actionBtns = clone.querySelector('.bg-black\\/10');
        if (actionBtns) actionBtns.remove();
        clone.style.left = `${left}px`;
        clone.style.top = `${top}px`;
        nodesHtml += new XMLSerializer().serializeToString(clone);
      });

      const svgPaths = document.getElementById('svgLayer').querySelectorAll('path');
      let pathsSvg = '';
      svgPaths.forEach(p => {
        const d = p.getAttribute('d').replace(/([M L])\s*(-?\d+\.?\d*)\s*(-?\d+\.?\d*)/g, (_, cmd, x, y) => {
          return `${cmd} ${parseFloat(x) - minX} ${parseFloat(y) - minY}`;
        });
        pathsSvg += `<path d="${d}" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>`;
      });

      const svgStr = `
        <svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
          <defs>
            <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
            </marker>
          </defs>
          <rect width="100%" height="100%" fill="${canvasBgColor}"/>
          <g>${pathsSvg}</g>
          <foreignObject width="${w}" height="${h}">
            <div xmlns="http://www.w3.org/1999/xhtml" style="position:relative; width:${w}px; height:${h}px;">
              <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"/>
              ${nodesHtml}
            </div>
          </foreignObject>
        </svg>
      `;

      const img = new Image();
      const blob = new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(blob);

      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = w * 2;
        canvas.height = h * 2;
        const ctx = canvas.getContext('2d');
        ctx.scale(2, 2);
        ctx.drawImage(img, 0, 0);
        URL.revokeObjectURL(url);

        const a = document.createElement('a');
        a.download = `flowchart_${Date.now()}.png`;
        a.href = canvas.toDataURL('image/png');
        a.click();
        showToast('PNGを保存しました');
      };
      img.src = url;
    };

    // --- INITIALIZATION ---
    window.onload = () => {
      if (!loadFromStorage()) {
        treeData = JSON.parse(JSON.stringify(defaultData));
      }
      render();
      centerView();
    };
  </script>
</body>
</html>
