<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>自動レイアウト フローチャート作成ツール</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #viewport {
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    .node-input {
      touch-action: auto;
      user-select: text;
      -webkit-user-select: text;
    }
    .bg-grid {
      background-size: 20px 20px;
      background-image: radial-gradient(circle, rgba(0,0,0,0.12) 1px, transparent 1px);
    }
    .node-transition {
      transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1), top 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .selected-node {
      ring: 2px;
      outline: 2px solid #6366f1;
      outline-offset: 2px;
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.2);
      border-radius: 3px;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 h-screen w-screen overflow-hidden flex flex-col select-none">

  <!-- Header / Toolbar Ribbon -->
  <header class="bg-white border-b border-slate-200 px-3 md:px-6 py-2 flex flex-col gap-2 z-20 shadow-sm flex-shrink-0">
    <!-- Top Row: App Info & Main Actions -->
    <div class="flex items-center justify-between gap-2 flex-wrap">
      <div class="flex items-center space-x-2">
        <div class="bg-indigo-600 text-white p-1.5 rounded-lg shadow">
          <i data-lucide="git-fork" class="w-4 h-4 md:w-5 md:h-5"></i>
        </div>
        <div>
          <h1 class="font-bold text-sm md:text-base text-slate-800 leading-none">フローチャート</h1>
          <span id="saveStatus" class="text-[10px] text-emerald-600 font-medium flex items-center gap-0.5 mt-0.5">
            <i data-lucide="check" class="w-3 h-3"></i> 保存済み
          </span>
        </div>
      </div>

      <div class="flex items-center flex-wrap gap-1.5">
        <!-- Canvas Background -->
        <div class="flex items-center bg-slate-100 rounded-lg px-2 py-1 border border-slate-200 gap-1" title="キャンバス背景色">
          <span class="text-[11px] font-medium text-slate-500 hidden sm:inline">背景:</span>
          <input type="color" id="canvasBgPicker" value="#f1f5f9" class="w-5 h-5 rounded cursor-pointer border-0 p-0 bg-transparent">
          <input type="text" id="canvasBgHex" value="#f1f5f9" maxlength="7" class="w-16 text-[11px] font-mono bg-white border border-slate-200 rounded px-1 py-0.5 uppercase outline-none focus:border-indigo-500" aria-label="キャンバス背景カラーコード">
        </div>

        <!-- Zoom Controls -->
        <div class="flex items-center bg-slate-100 rounded-lg p-0.5 border border-slate-200">
          <button id="btnZoomOut" title="縮小" class="p-1.5 hover:bg-white rounded text-slate-600">
            <i data-lucide="zoom-out" class="w-3.5 h-3.5"></i>
          </button>
          <span id="zoomLevel" class="text-[11px] font-semibold px-1 text-slate-600 min-w-[32px] text-center">100%</span>
          <button id="btnZoomIn" title="拡大" class="p-1.5 hover:bg-white rounded text-slate-600">
            <i data-lucide="zoom-in" class="w-3.5 h-3.5"></i>
          </button>
          <button id="btnResetZoom" title="リセット" class="p-1.5 hover:bg-white rounded text-slate-600 ml-0.5 border-l border-slate-200">
            <i data-lucide="maximize-2" class="w-3.5 h-3.5"></i>
          </button>
        </div>

        <button id="btnResetData" class="p-1.5 md:px-2.5 md:py-1.5 text-xs font-medium text-red-600 hover:bg-red-50 rounded-lg border border-red-200 flex items-center gap-1">
          <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
          <span class="hidden md:inline">初期化</span>
        </button>

        <button id="btnDownloadPng" class="px-2.5 py-1.5 text-xs font-semibold text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg shadow-sm flex items-center gap-1">
          <i data-lucide="download" class="w-3.5 h-3.5"></i>
          <span>PNG</span>
        </button>
      </div>
    </div>

    <!-- Bottom Row: Node Controls Ribbon (Active when a node is selected) -->
    <div class="flex items-center gap-2 pt-1.5 border-t border-slate-100 overflow-x-auto pb-1 text-xs">
      <span class="font-semibold text-slate-400 text-[11px] uppercase tracking-wider shrink-0">選択ノード:</span>
      
      <!-- Branch Add / Delete -->
      <div class="flex items-center gap-1 shrink-0">
        <button id="btnRibbonAddChild" class="px-2.5 py-1 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-semibold rounded-md border border-indigo-200 flex items-center gap-1 disabled:opacity-40" disabled>
          <i data-lucide="plus" class="w-3.5 h-3.5"></i>
          <span>分岐を追加</span>
        </button>
        <button id="btnRibbonDeleteNode" class="px-2 py-1 bg-red-50 hover:bg-red-100 text-red-600 rounded-md border border-red-200 flex items-center gap-1 disabled:opacity-40" disabled title="ノード削除">
          <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
          <span class="hidden sm:inline">削除</span>
        </button>
      </div>

      <div class="h-4 w-px bg-slate-200 shrink-0"></div>

      <!-- Node Style Inputs -->
      <div class="flex items-center gap-2 shrink-0">
        <div class="flex items-center gap-1 bg-slate-50 border border-slate-200 rounded-md px-1.5 py-0.5">
          <span class="text-[10px] text-slate-500 font-medium">背景</span>
          <input type="color" id="ribbonBgColorPicker" value="#ffffff" class="w-4 h-4 rounded cursor-pointer border-0 p-0 bg-transparent disabled:opacity-40" disabled>
          <input type="text" id="ribbonBgHex" value="#ffffff" maxlength="7" class="w-14 text-[10px] font-mono bg-white border border-slate-200 rounded px-1 py-0.5 uppercase outline-none focus:border-indigo-500 disabled:opacity-40" disabled aria-label="ノード背景カラーコード">
        </div>
        <div class="flex items-center gap-1 bg-slate-50 border border-slate-200 rounded-md px-1.5 py-0.5">
          <span class="text-[10px] text-slate-500 font-medium">文字</span>
          <input type="color" id="ribbonTextColorPicker" value="#1e293b" class="w-4 h-4 rounded cursor-pointer border-0 p-0 bg-transparent disabled:opacity-40" disabled>
          <input type="text" id="ribbonTextHex" value="#1e293b" maxlength="7" class="w-14 text-[10px] font-mono bg-white border border-slate-200 rounded px-1 py-0.5 uppercase outline-none focus:border-indigo-500 disabled:opacity-40" disabled aria-label="ノード文字カラーコード">
        </div>
      </div>

      <div class="h-4 w-px bg-slate-200 shrink-0"></div>

      <!-- Image & Branch Label Upload -->
      <div class="flex items-center gap-1.5 shrink-0">
        <label id="lblRibbonImage" class="px-2 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-md border border-slate-200 flex items-center gap-1 cursor-pointer opacity-40 pointer-events-none">
          <i data-lucide="image" class="w-3.5 h-3.5"></i>
          <span>画像</span>
          <input type="file" id="ribbonFileInput" accept="image/*" class="hidden" disabled>
        </label>
        <button id="btnRibbonRemoveImage" class="p-1 hover:bg-slate-200 text-slate-500 rounded hidden" title="画像を削除">
          <i data-lucide="image-minus" class="w-3.5 h-3.5 text-red-500"></i>
        </button>
      </div>

      <!-- Branch Label Text (if parent branch edge exists) -->
      <div id="branchLabelBox" class="flex items-center gap-1.5 shrink-0 ml-auto hidden">
        <span class="text-[11px] text-slate-500 font-medium">分岐矢印テキスト:</span>
        <input type="text" id="ribbonEdgeLabelInput" placeholder="例: はい / いいえ" class="px-2 py-0.5 text-xs rounded border border-slate-200 focus:ring-1 focus:ring-indigo-500 outline-none w-28 bg-white">
      </div>
    </div>
  </header>

  <!-- Main Work Area -->
  <main class="flex-1 relative overflow-hidden bg-slate-100 bg-grid cursor-grab active:cursor-grabbing" id="viewport">
    <div id="scene" class="absolute left-0 top-0 origin-0 transition-transform duration-75">
      <!-- SVG Connectors Layer -->
      <svg id="svgLayer" class="absolute left-0 top-0 pointer-events-none" style="overflow: visible;">
        <defs>
          <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b" />
          </marker>
        </defs>
      </svg>

      <!-- Connection Edge Labels Overlay Container -->
      <div id="edgeLabelsContainer" class="absolute left-0 top-0 pointer-events-auto"></div>

      <!-- HTML Nodes Container Layer -->
      <div id="nodesContainer" class="absolute left-0 top-0"></div>
    </div>
  </main>

  <!-- Notification Toast -->
  <div id="toast" class="fixed bottom-4 right-4 bg-slate-800 text-white text-xs px-3.5 py-2.5 rounded-xl shadow-lg border border-slate-700 flex items-center space-x-2 translate-y-20 opacity-0 transition-all z-50 pointer-events-none">
    <i data-lucide="info" class="w-4 h-4 text-indigo-400"></i>
    <span id="toastMsg">メッセージ</span>
  </div>

  <!-- Confirmation Modal Dialog (for Delete & Reset) -->
  <div id="confirmModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-50 hidden items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl border border-slate-200 max-w-sm w-full p-5 flex flex-col gap-4">
      <div class="flex items-start gap-3">
        <div class="bg-red-100 text-red-600 p-2 rounded-xl shrink-0">
          <i data-lucide="alert-triangle" class="w-5 h-5"></i>
        </div>
        <div>
          <h3 id="confirmModalTitle" class="font-bold text-sm text-slate-800">削除の確認</h3>
          <p id="confirmModalMessage" class="text-xs text-slate-600 mt-1 leading-relaxed">この分岐は編集済み、または子要素を含んでいます。本当に削除しますか？</p>
        </div>
      </div>
      <div class="flex items-center justify-end gap-2 pt-1">
        <button id="btnConfirmCancel" class="px-3.5 py-2 text-xs font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-xl transition-colors">
          キャンセル
        </button>
        <button id="btnConfirmOk" class="px-3.5 py-2 text-xs font-semibold text-white bg-red-600 hover:bg-red-700 rounded-xl shadow-sm transition-colors">
          削除する
        </button>
      </div>
    </div>
  </div>

  <script>
    // --- INITIAL TREE DATA ---
    const defaultData = {
      id: 'node-root',
      text: 'スタート (開始)',
      bgColor: '#4f46e5',
      textColor: '#ffffff',
      image: '',
      edgeLabel: '',
      children: [
        {
          id: 'node-1',
          text: 'ログイン確認？',
          bgColor: '#ffffff',
          textColor: '#1e293b',
          image: '',
          edgeLabel: '',
          children: [
            {
              id: 'node-1-1',
              text: 'マイページ表示',
              bgColor: '#ffffff',
              textColor: '#1e293b',
              image: '',
              edgeLabel: 'はい',
              children: []
            },
            {
              id: 'node-1-2',
              text: 'ログイン画面へ',
              bgColor: '#ffffff',
              textColor: '#1e293b',
              image: '',
              edgeLabel: 'いいえ',
              children: []
            }
          ]
        }
      ]
    };

    // --- APPLICATION STATE ---
    let treeData = null;
    let canvasBgColor = '#f1f5f9';
    let selectedNodeId = 'node-root';
    let zoomLevel = 1.0;
    let panX = 0, panY = 0;
    let isDragging = false;
    let startX = 0, startY = 0;
    const activePointers = new Map();
    let lastPinchDist = null;
    let lastPinchCenter = null;

    // TIGHT COMPACT LAYOUT CONSTANTS
    const GAP_X = 16; // Horizontal gap between siblings
    const GAP_Y = 44; // Vertical gap between parent and child (includes space for vertical arrow labels)
    const STORAGE_KEY = 'flowchart_v3_data';
    const DEFAULT_NEW_TEXT = '新規項目';

    // --- CUSTOM CONFIRM DIALOG ---
    let confirmCallback = null;
    function openConfirmModal(title, message, okLabel, onConfirm) {
      document.getElementById('confirmModalTitle').textContent = title;
      document.getElementById('confirmModalMessage').textContent = message;
      document.getElementById('btnConfirmOk').textContent = okLabel;
      confirmCallback = onConfirm;
      const modal = document.getElementById('confirmModal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeConfirmModal() {
      const modal = document.getElementById('confirmModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
      confirmCallback = null;
    }

    document.getElementById('btnConfirmCancel').onclick = closeConfirmModal;
    document.getElementById('btnConfirmOk').onclick = () => {
      if (confirmCallback) confirmCallback();
      closeConfirmModal();
    };

    // Check if a node or any descendant has been edited or contains sub-branches
    function isBranchEditedOrHasChildren(node, parentNode) {
      if (!node) return false;
      if (node.children && node.children.length > 0) return true;
      if (node.text && node.text.trim() !== '' && node.text.trim() !== DEFAULT_NEW_TEXT) return true;
      if (node.image) return true;
      if (parentNode) {
        if ((node.bgColor || '').toLowerCase() !== (parentNode.bgColor || '').toLowerCase()) return true;
        if ((node.textColor || '').toLowerCase() !== (parentNode.textColor || '').toLowerCase()) return true;
      }
      return false;
    }

    // Auto-size textarea & hidden sizer so node width/height hugs text cleanly
    function syncTextareaDimensions(textarea, sizer) {
      if (!textarea || !sizer) return;
      const val = textarea.value || textarea.placeholder || ' ';
      sizer.textContent = val.endsWith('\n') ? val + ' ' : val;
      const measuredW = Math.min(360, Math.max(60, Math.ceil(sizer.getBoundingClientRect().width) + 14));
      textarea.style.width = `${measuredW}px`;
      textarea.style.height = 'auto';
      textarea.style.height = `${Math.max(20, textarea.scrollHeight)}px`;
    }

    // Auto-size branch label input to fit its text so it never clips
    function syncEdgeInputWidth(inputEl, sizerEl) {
      if (!inputEl || !sizerEl) return;
      const val = inputEl.value || inputEl.placeholder || ' ';
      sizerEl.textContent = val;
      const measuredW = Math.max(40, Math.ceil(sizerEl.scrollWidth || sizerEl.getBoundingClientRect().width) + 18);
      inputEl.style.width = `${measuredW}px`;
    }

    // --- STORAGE MANAGEMENT ---
    function saveToStorage() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          tree: treeData,
          canvasBg: canvasBgColor
        }));
      } catch (e) {}
    }

    function loadFromStorage() {
      try {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) {
          const parsed = JSON.parse(stored);
          treeData = parsed.tree || parsed;
          canvasBgColor = parsed.canvasBg || '#f1f5f9';
          return true;
        }
      } catch (e) {}
      return false;
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toastMsg').textContent = msg;
      toast.classList.remove('translate-y-20', 'opacity-0');
      setTimeout(() => toast.classList.add('translate-y-20', 'opacity-0'), 2200);
    }

    // --- TREE MEASUREMENT & COMPACT AUTOMATIC LAYOUT ---
    function measureSubtrees(node) {
      const nodeEl = document.getElementById(node.id);
      node._width = nodeEl ? Math.max(80, nodeEl.offsetWidth) : 120;
      node._height = nodeEl ? nodeEl.offsetHeight : 40;

      if (!node.children || node.children.length === 0) {
        node._subtreeWidth = node._width;
        node._centerOffset = node._width / 2;
        return;
      }

      let totalWidth = 0;
      const n = node.children.length;
      node.children.forEach((child, idx) => {
        measureSubtrees(child);
        totalWidth += child._subtreeWidth;
        if (idx < n - 1) totalWidth += GAP_X;
      });

      node._subtreeWidth = Math.max(node._width, totalWidth);
      node._centerOffset = node._subtreeWidth / 2;
    }

    function positionNodes(node, currentX, currentY) {
      node._x = currentX;
      node._y = currentY;

      if (!node.children || node.children.length === 0) return;

      const children = node.children;
      const n = children.length;
      const nextY = currentY + node._height + GAP_Y;

      let baseTotal = 0;
      children.forEach((c, idx) => {
        baseTotal += c._subtreeWidth;
        if (idx < n - 1) baseTotal += GAP_X;
      });

      let startX = currentX - baseTotal / 2;
      children.forEach((child) => {
        const w = child._subtreeWidth;
        const childCenterX = startX + w / 2;
        positionNodes(child, childCenterX, nextY);
        startX += w + GAP_X;
      });
    }

    // --- RENDER ENGINE ---
    function render(skipActiveInputSync = false) {
      const container = document.getElementById('nodesContainer');
      const edgeLabelsContainer = document.getElementById('edgeLabelsContainer');
      const svgLayer = document.getElementById('svgLayer');

      document.getElementById('viewport').style.backgroundColor = canvasBgColor;
      document.getElementById('canvasBgPicker').value = canvasBgColor;
      if (document.activeElement !== document.getElementById('canvasBgHex')) {
        document.getElementById('canvasBgHex').value = canvasBgColor;
      }

      // STEP 1: Sync Nodes without destroying active textareas
      const existingNodes = new Map();
      container.querySelectorAll('.flow-node').forEach(el => existingNodes.set(el.id, el));

      const allNodes = [];
      const connections = [];

      function collect(node, parent) {
        allNodes.push(node);
        if (parent) connections.push({ parent, child: node });
        if (node.children) node.children.forEach(c => collect(c, node));
      }
      collect(treeData, null);

      allNodes.forEach(node => {
        let el = existingNodes.get(node.id);
        if (!el) {
          el = document.createElement('div');
          el.id = node.id;
          el.className = 'flow-node absolute node-transition rounded-lg shadow-sm border border-slate-300 flex flex-col justify-center overflow-hidden cursor-pointer group min-w-[80px] max-w-[380px]';
          el.innerHTML = `
            <div class="node-image-wrap w-full bg-black/5 flex items-center justify-center p-1 border-b border-black/5 hidden">
              <img class="node-image max-w-full max-h-24 object-contain rounded" alt="ノード画像">
            </div>
            <div class="px-2.5 py-1.5 relative flex items-center justify-center">
              <span class="node-sizer invisible fixed pointer-events-none whitespace-pre text-xs font-bold leading-normal max-w-[360px]" aria-hidden="true"></span>
              <textarea
                rows="1"
                placeholder="文字を入力"
                class="node-input node-text bg-transparent border-0 resize-none overflow-hidden text-xs font-bold leading-normal outline-none text-center p-0 m-0 focus:ring-0 placeholder:opacity-50"
              ></textarea>
            </div>
          `;
          container.appendChild(el);

          const textEl = el.querySelector('.node-text');
          const sizerEl = el.querySelector('.node-sizer');

          el.addEventListener('click', (e) => {
            e.stopPropagation();
            if (selectedNodeId !== node.id) {
              selectNode(node.id);
            }
          });

          textEl.addEventListener('focus', () => {
            if (selectedNodeId !== node.id) {
              selectedNodeId = node.id;
              document.querySelectorAll('.flow-node').forEach(n => n.classList.remove('selected-node', 'shadow-md'));
              el.classList.add('selected-node', 'shadow-md');
              updateRibbonState();
            }
          });

          textEl.addEventListener('input', (e) => {
            const currentNode = findNode(treeData, node.id);
            if (currentNode) {
              currentNode.text = e.target.value;
              syncTextareaDimensions(textEl, sizerEl);
              relayoutOnly();
              saveToStorage();
            }
          });

          textEl.addEventListener('blur', () => {
            saveToStorage();
            relayoutOnly();
          });
        }

        // Selection Highlight
        if (node.id === selectedNodeId) {
          el.classList.add('selected-node', 'shadow-md');
        } else {
          el.classList.remove('selected-node', 'shadow-md');
        }

        el.style.backgroundColor = node.bgColor || '#ffffff';
        el.style.color = node.textColor || '#1e293b';

        // Image sync
        const imgWrap = el.querySelector('.node-image-wrap');
        const imgEl = el.querySelector('.node-image');
        if (node.image) {
          if (imgEl.src !== node.image) {
            imgEl.onload = () => relayoutOnly();
            imgEl.src = node.image;
          }
          imgWrap.classList.remove('hidden');
        } else {
          imgWrap.classList.add('hidden');
          imgEl.removeAttribute('src');
        }

        // Text sync (preserve active focus)
        const textEl = el.querySelector('.node-text');
        const sizerEl = el.querySelector('.node-sizer');
        textEl.style.color = node.textColor || '#1e293b';
        if (!skipActiveInputSync && document.activeElement !== textEl) {
          textEl.value = node.text || '';
        }
        syncTextareaDimensions(textEl, sizerEl);
      });

      // Remove obsolete nodes
      const activeIds = new Set(allNodes.map(n => n.id));
      existingNodes.forEach((el, id) => {
        if (!activeIds.has(id)) el.remove();
      });

      // STEP 2: Position & Orthogonal Connectors Calculation
      relayoutOnly(connections, allNodes);
      lucide.createIcons();
      updateRibbonState();
      saveToStorage();
    }

    function relayoutOnly(precollectedConnections = null, precollectedNodes = null) {
      const edgeLabelsContainer = document.getElementById('edgeLabelsContainer');
      const svgLayer = document.getElementById('svgLayer');

      const allNodes = precollectedNodes || [];
      const connections = precollectedConnections || [];
      if (!precollectedNodes) {
        function collect(node, parent) {
          allNodes.push(node);
          if (parent) connections.push({ parent, child: node });
          if (node.children) node.children.forEach(c => collect(c, node));
        }
        collect(treeData, null);
      }

      requestAnimationFrame(() => {
        measureSubtrees(treeData);
        positionNodes(treeData, 0, 40);

        allNodes.forEach(node => {
          const el = document.getElementById(node.id);
          if (el) {
            el.style.left = `${node._x - el.offsetWidth / 2}px`;
            el.style.top = `${node._y}px`;
          }
        });

        // Draw Lines & Branch Text Labels
        const contrastColor = getContrastColorForBg(canvasBgColor);
        const isDarkBg = contrastColor === '#ffffff';
        svgLayer.innerHTML = `
          <defs>
            <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <path d="M 0 1 L 10 5 L 0 9 z" fill="${contrastColor}" />
            </marker>
          </defs>
        `;

        const existingEdgeInputs = new Map();
        edgeLabelsContainer.querySelectorAll('.edge-label-wrap').forEach(w => {
          existingEdgeInputs.set(w.dataset.childId, w);
        });
        const activeEdgeChildIds = new Set();

        connections.forEach(({ parent, child }) => {
          const pEl = document.getElementById(parent.id);
          const cEl = document.getElementById(child.id);
          if (!pEl || !cEl) return;

          const x1 = parent._x;
          const y1 = parent._y + pEl.offsetHeight;
          const x2 = child._x;
          const y2 = child._y;

          // Keep horizontal bus close to parent so the vertical segment above each child has ample room
          const midY = y1 + 12;
          const pathD = `M ${x1} ${y1} L ${x1} ${midY} L ${x2} ${midY} L ${x2} ${y2}`;

          const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          path.setAttribute('d', pathD);
          path.setAttribute('stroke', contrastColor);
          path.setAttribute('stroke-width', '1.5');
          path.setAttribute('fill', 'none');
          path.setAttribute('marker-end', 'url(#arrowhead)');
          svgLayer.appendChild(path);

          // 分岐が2つ以上ある場合のみ、各選択肢の真上にある縦矢印の中央にラベルを表示
          if (parent.children && parent.children.length >= 2) {
            activeEdgeChildIds.add(child.id);
            let labelWrapper = existingEdgeInputs.get(child.id);
            if (!labelWrapper) {
              labelWrapper = document.createElement('div');
              labelWrapper.dataset.childId = child.id;
              labelWrapper.className = 'edge-label-wrap absolute z-10 flex items-center justify-center whitespace-nowrap w-max';

              const labelSizer = document.createElement('span');
              labelSizer.className = 'edge-label-sizer invisible absolute pointer-events-none whitespace-pre text-[10px] font-bold px-1';
              labelSizer.setAttribute('aria-hidden', 'true');

              const labelInput = document.createElement('input');
              labelInput.type = 'text';
              labelInput.placeholder = '分岐名';
              labelInput.className = 'node-input text-[10px] border-0 outline-none focus:ring-1 focus:ring-indigo-400 rounded px-1 py-0.5 font-bold min-w-[40px] max-w-none shrink-0 text-center';

              labelInput.addEventListener('focus', () => {
                if (selectedNodeId !== child.id) {
                  selectedNodeId = child.id;
                  document.querySelectorAll('.flow-node').forEach(n => n.classList.remove('selected-node', 'shadow-md'));
                  const targetNodeEl = document.getElementById(child.id);
                  if (targetNodeEl) targetNodeEl.classList.add('selected-node', 'shadow-md');
                  updateRibbonState();
                }
              });

              labelInput.addEventListener('input', (e) => {
                const targetChild = findNode(treeData, child.id);
                if (targetChild) {
                  targetChild.edgeLabel = e.target.value;
                  syncEdgeInputWidth(labelInput, labelSizer);
                  const ribbonEdge = document.getElementById('ribbonEdgeLabelInput');
                  if (selectedNodeId === child.id && document.activeElement !== ribbonEdge) {
                    ribbonEdge.value = e.target.value;
                  }
                  saveToStorage();
                }
              });

              labelWrapper.appendChild(labelSizer);
              labelWrapper.appendChild(labelInput);
              edgeLabelsContainer.appendChild(labelWrapper);
            }

            const inputEl = labelWrapper.querySelector('input');
            const sizerEl = labelWrapper.querySelector('.edge-label-sizer');
            const labelBg = hexToRgba(canvasBgColor, 0.88);
            inputEl.style.color = contrastColor;
            inputEl.style.backgroundColor = labelBg;
            inputEl.classList.toggle('focus:bg-slate-800/95', isDarkBg);
            inputEl.classList.toggle('focus:bg-white/95', !isDarkBg);
            inputEl.classList.toggle('placeholder:text-slate-300', isDarkBg);
            inputEl.classList.toggle('placeholder:text-slate-500', !isDarkBg);
            if (document.activeElement !== inputEl) {
              inputEl.value = child.edgeLabel || '';
            }
            syncEdgeInputWidth(inputEl, sizerEl);

            // 選択肢の上の縦矢印（x2, midY〜y2の中間）に中央揃えで配置
            const verticalMidY = midY + (y2 - midY - 4) / 2;
            labelWrapper.style.left = `${x2}px`;
            labelWrapper.style.top = `${verticalMidY}px`;
            labelWrapper.style.transform = 'translate(-50%, -50%)';
          }
        });

        existingEdgeInputs.forEach((el, childId) => {
          if (!activeEdgeChildIds.has(childId)) el.remove();
        });
      });
    }

    // --- NODE SELECTION & RIBBON STATE CONTROL ---
    function selectNode(id) {
      selectedNodeId = id;
      render();
    }

    function updateRibbonState() {
      const selectedNode = findNode(treeData, selectedNodeId);

      const btnAdd = document.getElementById('btnRibbonAddChild');
      const btnDel = document.getElementById('btnRibbonDeleteNode');
      const bgPicker = document.getElementById('ribbonBgColorPicker');
      const bgHex = document.getElementById('ribbonBgHex');
      const textPicker = document.getElementById('ribbonTextColorPicker');
      const textHex = document.getElementById('ribbonTextHex');
      const lblImg = document.getElementById('lblRibbonImage');
      const fileInput = document.getElementById('ribbonFileInput');
      const btnRemoveImg = document.getElementById('btnRibbonRemoveImage');
      const branchBox = document.getElementById('branchLabelBox');
      const edgeInput = document.getElementById('ribbonEdgeLabelInput');

      if (selectedNode) {
        btnAdd.disabled = false;
        btnDel.disabled = (selectedNode.id === treeData.id);
        bgPicker.disabled = false;
        bgHex.disabled = false;
        textPicker.disabled = false;
        textHex.disabled = false;
        fileInput.disabled = false;

        const bgVal = selectedNode.bgColor || '#ffffff';
        const txtVal = selectedNode.textColor || '#1e293b';
        bgPicker.value = bgVal;
        if (document.activeElement !== bgHex) bgHex.value = bgVal;
        textPicker.value = txtVal;
        if (document.activeElement !== textHex) textHex.value = txtVal;

        lblImg.classList.remove('opacity-40', 'pointer-events-none');

        if (selectedNode.image) {
          btnRemoveImg.classList.remove('hidden');
        } else {
          btnRemoveImg.classList.add('hidden');
        }
        // Branch Edge Label input binding (available if not root and parent has 2+ children)
        const parentNode = findParentNode(treeData, selectedNode.id);
        if (parentNode && parentNode.children && parentNode.children.length >= 2) {
          branchBox.classList.remove('hidden');
          if (document.activeElement !== edgeInput) {
            edgeInput.value = selectedNode.edgeLabel || '';
          }
        } else {
          branchBox.classList.add('hidden');
        }
      } else {
        btnAdd.disabled = true;
        btnDel.disabled = true;
        bgPicker.disabled = true;
        bgHex.disabled = true;
        textPicker.disabled = true;
        textHex.disabled = true;
        fileInput.disabled = true;
        lblImg.classList.add('opacity-40', 'pointer-events-none');
        btnRemoveImg.classList.add('hidden');
        branchBox.classList.add('hidden');
      }
    }

    // Ribbon Action Handlers
    document.getElementById('btnRibbonAddChild').onclick = () => {
      if (!selectedNodeId) return;
      const parent = findNode(treeData, selectedNodeId);
      if (parent) {
        if (!parent.children) parent.children = [];
        const newNodeId = generateId();
        
        // 親（分岐元）ノードの色やスタイルを継承
        parent.children.push({
          id: newNodeId,
          text: DEFAULT_NEW_TEXT,
          bgColor: parent.bgColor || '#ffffff',
          textColor: parent.textColor || '#1e293b',
          image: '',
          edgeLabel: parent.children.length === 0 ? 'はい' : (parent.children.length === 1 ? 'いいえ' : ''),
          children: []
        });
        selectedNodeId = newNodeId;
        render();
        showToast('分岐を追加しました');
      }
    };

    document.getElementById('btnRibbonDeleteNode').onclick = () => {
      if (!selectedNodeId || selectedNodeId === treeData.id) return;
      const targetNode = findNode(treeData, selectedNodeId);
      const parentNode = findParentNode(treeData, selectedNodeId);
      if (!targetNode) return;

      const performDelete = () => {
        deleteNode(treeData, targetNode.id);
        selectedNodeId = parentNode ? parentNode.id : treeData.id;
        render();
        showToast('ノードを削除しました');
      };

      if (isBranchEditedOrHasChildren(targetNode, parentNode)) {
        openConfirmModal(
          '分岐の削除確認',
          'この分岐は文字・画像・色が編集されているか、配下に別の分岐が含まれています。削除してもよろしいですか？',
          '削除する',
          performDelete
        );
      } else {
        performDelete();
      }
    };

    function normalizeHex(val) {
      let v = val.trim();
      if (!v.startsWith('#')) v = '#' + v;
      return /^#[0-9A-Fa-f]{6}$/.test(v) ? v.toLowerCase() : null;
    }

    function hexToRgba(hexColor, alpha) {
      const hex = normalizeHex(hexColor) || '#f1f5f9';
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    function getContrastColorForBg(hexColor) {
      const hex = normalizeHex(hexColor) || '#f1f5f9';
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
      return luminance > 0.5 ? '#1e293b' : '#ffffff';
    }

    document.getElementById('ribbonBgColorPicker').oninput = (e) => {
      const node = findNode(treeData, selectedNodeId);
      if (node) {
        node.bgColor = e.target.value;
        document.getElementById('ribbonBgHex').value = e.target.value;
        render();
      }
    };

    document.getElementById('ribbonBgHex').oninput = (e) => {
      const hex = normalizeHex(e.target.value);
      const node = findNode(treeData, selectedNodeId);
      if (hex && node) {
        node.bgColor = hex;
        document.getElementById('ribbonBgColorPicker').value = hex;
        render();
      }
    };

    document.getElementById('ribbonTextColorPicker').oninput = (e) => {
      const node = findNode(treeData, selectedNodeId);
      if (node) {
        node.textColor = e.target.value;
        document.getElementById('ribbonTextHex').value = e.target.value;
        render();
      }
    };

    document.getElementById('ribbonTextHex').oninput = (e) => {
      const hex = normalizeHex(e.target.value);
      const node = findNode(treeData, selectedNodeId);
      if (hex && node) {
        node.textColor = hex;
        document.getElementById('ribbonTextColorPicker').value = hex;
        render();
      }
    };

    document.getElementById('ribbonFileInput').onchange = (e) => {
      const file = e.target.files[0];
      const node = findNode(treeData, selectedNodeId);
      if (file && node) {
        const reader = new FileReader();
        reader.onload = (evt) => {
          node.image = evt.target.result;
          render();
          showToast('画像を追加しました');
        };
        reader.readAsDataURL(file);
      }
    };

    document.getElementById('btnRibbonRemoveImage').onclick = () => {
      const node = findNode(treeData, selectedNodeId);
      if (node) {
        node.image = '';
        render();
        showToast('画像を削除しました');
      }
    };

    document.getElementById('ribbonEdgeLabelInput').oninput = (e) => {
      const node = findNode(treeData, selectedNodeId);
      if (node) {
        node.edgeLabel = e.target.value;
        relayoutOnly();
        saveToStorage();
      }
    };

    document.getElementById('canvasBgPicker').oninput = (e) => {
      canvasBgColor = e.target.value;
      document.getElementById('canvasBgHex').value = e.target.value;
      render();
    };

    document.getElementById('canvasBgHex').oninput = (e) => {
      const hex = normalizeHex(e.target.value);
      if (hex) {
        canvasBgColor = hex;
        document.getElementById('canvasBgPicker').value = hex;
        render();
      }
    };

    // Helper utilities
    function escapeHtml(str) {
      return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function findNode(node, id) {
      if (node.id === id) return node;
      if (node.children) {
        for (let child of node.children) {
          const res = findNode(child, id);
          if (res) return res;
        }
      }
      return null;
    }

    function findParentNode(parent, childId) {
      if (!parent.children) return null;
      for (let child of parent.children) {
        if (child.id === childId) return parent;
        const res = findParentNode(child, childId);
        if (res) return res;
      }
      return null;
    }

    function deleteNode(parent, id) {
      if (!parent.children) return false;
      const idx = parent.children.findIndex(c => c.id === id);
      if (idx !== -1) {
        parent.children.splice(idx, 1);
        return true;
      }
      for (let child of parent.children) {
        if (deleteNode(child, id)) return true;
      }
      return false;
    }

    function generateId() {
      return 'node-' + Math.random().toString(36).substr(2, 9);
    }

    // --- VIEWPORT PAN & ZOOM ---
    const viewport = document.getElementById('viewport');
    const scene = document.getElementById('scene');

    function updateTransform() {
      scene.style.transform = `translate(${panX}px, ${panY}px) scale(${zoomLevel})`;
      document.getElementById('zoomLevel').textContent = `${Math.round(zoomLevel * 100)}%`;
    }

    function centerView() {
      const rect = viewport.getBoundingClientRect();
      panX = rect.width / 2;
      panY = 60;
      zoomLevel = 1.0;
      updateTransform();
    }

    function isInteractiveTarget(target) {
      return Boolean(target.closest('input, textarea, button, label, [contenteditable="true"]'));
    }

    function getPinchMetrics() {
      const pts = Array.from(activePointers.values());
      const dx = pts[0].clientX - pts[1].clientX;
      const dy = pts[0].clientY - pts[1].clientY;
      return {
        dist: Math.hypot(dx, dy),
        centerX: (pts[0].clientX + pts[1].clientX) / 2,
        centerY: (pts[0].clientY + pts[1].clientY) / 2
      };
    }

    viewport.addEventListener('pointerdown', (e) => {
      if (isInteractiveTarget(e.target)) return;
      activePointers.set(e.pointerId, { clientX: e.clientX, clientY: e.clientY });

      if (activePointers.size === 1) {
        isDragging = true;
        startX = e.clientX - panX;
        startY = e.clientY - panY;
        lastPinchDist = null;
        lastPinchCenter = null;
      } else if (activePointers.size >= 2) {
        isDragging = false;
        const { dist, centerX, centerY } = getPinchMetrics();
        lastPinchDist = dist;
        lastPinchCenter = { x: centerX, y: centerY };
      }
    });

    window.addEventListener('pointermove', (e) => {
      if (!activePointers.has(e.pointerId)) return;
      activePointers.set(e.pointerId, { clientX: e.clientX, clientY: e.clientY });

      if (activePointers.size >= 2) {
        const { dist, centerX, centerY } = getPinchMetrics();
        if (lastPinchDist && lastPinchDist > 0 && lastPinchCenter) {
          const rect = viewport.getBoundingClientRect();
          const scaleFactor = dist / lastPinchDist;
          const newZoom = Math.min(Math.max(0.3, zoomLevel * scaleFactor), 2.5);

          const focalX = centerX - rect.left;
          const focalY = centerY - rect.top;
          const prevFocalX = lastPinchCenter.x - rect.left;
          const prevFocalY = lastPinchCenter.y - rect.top;

          panX = focalX - (prevFocalX - panX) * (newZoom / zoomLevel);
          panY = focalY - (prevFocalY - panY) * (newZoom / zoomLevel);
          zoomLevel = newZoom;
          updateTransform();
        }
        lastPinchDist = dist;
        lastPinchCenter = { x: centerX, y: centerY };
      } else if (activePointers.size === 1 && isDragging) {
        panX = e.clientX - startX;
        panY = e.clientY - startY;
        updateTransform();
      }
    });

    function handlePointerRelease(e) {
      if (!activePointers.has(e.pointerId)) return;
      activePointers.delete(e.pointerId);

      if (activePointers.size === 1) {
        const remaining = Array.from(activePointers.values())[0];
        isDragging = true;
        startX = remaining.clientX - panX;
        startY = remaining.clientY - panY;
        lastPinchDist = null;
        lastPinchCenter = null;
      } else if (activePointers.size === 0) {
        isDragging = false;
        lastPinchDist = null;
        lastPinchCenter = null;
      }
    }

    window.addEventListener('pointerup', handlePointerRelease);
    window.addEventListener('pointercancel', handlePointerRelease);

    viewport.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
      const newZoom = Math.min(Math.max(0.3, zoomLevel * zoomFactor), 2.5);

      const rect = viewport.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;

      panX = mouseX - (mouseX - panX) * (newZoom / zoomLevel);
      panY = mouseY - (mouseY - panY) * (newZoom / zoomLevel);

      zoomLevel = newZoom;
      updateTransform();
    }, { passive: false });

    document.getElementById('btnZoomIn').onclick = () => { zoomLevel = Math.min(2.5, zoomLevel * 1.15); updateTransform(); };
    document.getElementById('btnZoomOut').onclick = () => { zoomLevel = Math.max(0.3, zoomLevel / 1.15); updateTransform(); };
    document.getElementById('btnResetZoom').onclick = centerView;

    document.getElementById('btnResetData').onclick = () => {
      openConfirmModal(
        'データの初期化',
        'すべてのフローチャートデータが初期状態に戻ります。よろしいですか？',
        '初期化する',
        () => {
          treeData = JSON.parse(JSON.stringify(defaultData));
          canvasBgColor = '#f1f5f9';
          selectedNodeId = treeData.id;
          render();
          centerView();
          showToast('リセットしました');
        }
      );
    };

    // PNG Download Engine
    document.getElementById('btnDownloadPng').onclick = () => {
      showToast('画像を保存中...');
      const nodeElements = document.querySelectorAll('#nodesContainer > .flow-node');
      if (nodeElements.length === 0) return;

      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      nodeElements.forEach(el => {
        const x = parseFloat(el.style.left);
        const y = parseFloat(el.style.top);
        minX = Math.min(minX, x);
        minY = Math.min(minY, y);
        maxX = Math.max(maxX, x + el.offsetWidth);
        maxY = Math.max(maxY, y + el.offsetHeight);
      });

      const pad = 40;
      minX -= pad; minY -= pad; maxX += pad; maxY += pad;
      const w = maxX - minX;
      const h = maxY - minY;

      let nodesHtml = '';
      nodeElements.forEach(el => {
        const left = parseFloat(el.style.left) - minX;
        const top = parseFloat(el.style.top) - minY;
        const clone = el.cloneNode(true);
        clone.classList.remove('selected-node');
        clone.style.left = `${left}px`;
        clone.style.top = `${top}px`;
        const origTa = el.querySelector('textarea');
        const cloneTa = clone.querySelector('textarea');
        if (origTa && cloneTa) {
          const textDiv = document.createElement('div');
          textDiv.className = 'text-xs font-bold leading-normal text-center whitespace-pre-wrap break-words';
          textDiv.style.color = origTa.style.color;
          textDiv.textContent = origTa.value;
          cloneTa.replaceWith(textDiv);
        }
        nodesHtml += new XMLSerializer().serializeToString(clone);
      });

      const svgPaths = document.getElementById('svgLayer').querySelectorAll('path');
      const contrastColor = getContrastColorForBg(canvasBgColor);
      let pathsSvg = '';
      svgPaths.forEach(p => {
        const d = p.getAttribute('d').replace(/([M L])\s*(-?\d+\.?\d*)\s*(-?\d+\.?\d*)/g, (_, cmd, x, y) => {
          return `${cmd} ${parseFloat(x) - minX} ${parseFloat(y) - minY}`;
        });
        pathsSvg += `<path d="${d}" stroke="${contrastColor}" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>`;
      });

      let edgeLabelsHtml = '';
      const labelBgRgba = hexToRgba(canvasBgColor, 0.88);
      document.querySelectorAll('#edgeLabelsContainer > .edge-label-wrap').forEach(wrap => {
        const inp = wrap.querySelector('input');
        if (!inp || !inp.value.trim()) return;
        const left = parseFloat(wrap.style.left) - minX;
        const top = parseFloat(wrap.style.top) - minY;
        edgeLabelsHtml += `<div style="position:absolute; left:${left}px; top:${top}px; transform:translate(-50%, -50%); padding:1px 4px; border-radius:4px; background-color:${labelBgRgba}; text-align:center; font-size:10px; font-weight:700; color:${contrastColor}; white-space:nowrap;">${escapeHtml(inp.value)}</div>`;
      });

      const svgStr = `
        <svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
          <defs>
            <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <path d="M 0 1 L 10 5 L 0 9 z" fill="${contrastColor}" />
            </marker>
          </defs>
          <rect width="100%" height="100%" fill="${canvasBgColor}"/>
          <g>${pathsSvg}</g>
          <foreignObject width="${w}" height="${h}">
            <div xmlns="http://www.w3.org/1999/xhtml" style="position:relative; width:${w}px; height:${h}px;">
              <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"/>
              ${nodesHtml}
              ${edgeLabelsHtml}
            </div>
          </foreignObject>
        </svg>
      `;

      const img = new Image();
      const blob = new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(blob);

      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = w * 2;
        canvas.height = h * 2;
        const ctx = canvas.getContext('2d');
        ctx.scale(2, 2);
        ctx.drawImage(img, 0, 0);
        URL.revokeObjectURL(url);

        const a = document.createElement('a');
        a.download = `flowchart_${Date.now()}.png`;
        a.href = canvas.toDataURL('image/png');
        a.click();
        showToast('PNGをダウンロードしました');
      };
      img.src = url;
    };

    window.onload = () => {
      if (!loadFromStorage()) {
        treeData = JSON.parse(JSON.stringify(defaultData));
      }
      render();
      centerView();
    };
  </script>
</body>
</html>
